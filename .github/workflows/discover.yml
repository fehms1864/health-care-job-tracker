name: Find job boards for unresolved companies

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['scripts/discover.py']

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/discover.py
      - run: |
          git config user.name "job-tracker-bot"
          git config user.email "job-tracker-bot@users.noreply.github.com"
          git add data/discovery.json
          git diff --cached --quiet || git commit -m "Board discovery report"
          git pull --rebase --autostash origin main || true
          git push
